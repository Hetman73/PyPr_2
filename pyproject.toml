[project]
name = "pythonproject-2"
version = "0.1.0"
description = "Рабочий проект для решения задачь в процессе курса обучения"
authors = [
    {name = "Viktor Getjmanov",email = "palada1973@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]



[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''


[tool.isort]
# максимальная длина строки
line_length = 119



[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
pythonpath = ["src"]
